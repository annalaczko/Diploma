# Only preprocessing, with the fixed half-page-width crop of configs/dinov3.yaml, for both splits:
# the train scans (to fine-tune on) and the test scans (to extract features from and evaluate),
# so both get exactly the same steps. Run:  python run_experiment.py configs/only_prep/raster_crop.yaml
# The images land in data/pipeline/<run name>/PreprocessingStep/Repair/; use those folders as
# data.preprocessed_path and data.extract_path in configs/dinov3_finetune.yaml.

# ===================================================================== run
experiment: prep             # MLflow experiment name
name: raster-crop05          # run name; the sweep adds the split to it
stop_after: preprocessing    # no model, no clustering
sweep:                       # one run per split
  data.raw_path: [/data/alaczko/legion_raw_train, /data/alaczko/legion_raw_test]

# ===================================================================== data
data:
  source: raw
  raw_path: /data/alaczko/legion_raw_train   # set by the sweep: the 5732 train scans (hard links into /data/alaczko/legion_raw,
                                    # the same images as /data/alaczko/processed/legion/raster/train) and the 439 test scans

# ===================================================================== preprocessing
# The same steps as configs/dinov3.yaml.
preprocessing:
  mode: memory               # memory: only the last step's images are saved | disk: every step's are
  batch_size: 256            # images preprocessed at once in memory mode
  steps:
    - BackgroundEraser:
        mode: segmentation
        model: /data/alaczko/models/yolov8n_seg_finetuned.pt
        batch_size: 256      # YOLO inference batch; lower it on CUDA out-of-memory
        mask_margin: 0.01
        crop_size: 0.5       # square side = half the scan width, centered on the shard; null = fitted to the shard
                             # (shards larger than that are cut off, listed in MLflow as clipped.txt)
        record_axes: true
        debug_images: 0
    - Normalizer:
        target_size: 256
        background_color: [255, 255, 255]
    - Repair:
        contrast_factor: 5
        dilate_kernel_size: 1
        dilate_iterations: 1
        skeletonize: false
        output_thickness: 2
        debug_images: 0

# Centuria top5 (generated by configs/centuria/make_top5.py): CENT-NTX-P-N-u3 features of the
# 429 top5 images (data/pipeline/CENT-NTX-P-N-u3__methodward-metriceuclidean__20261117-104444/FeatureLearningStep/DINOv3/features.csv), 5 clusters, evaluated.
experiment: centuria-eval
name: CENT-top5-NTX-P-N-u3
stop_after: null
sweep:
  clustering.method:
  - ward
  - average
  - weighted
  clustering.metric:
  - euclidean
  - cosine
data:
  source: preprocessed
  labels: /data/alaczko/centuria/centuria_labels_top5.csv
  extract_path: null
  features: data/pipeline/CENT-top5-NTX-P-N-u3__features/FeatureLearningStep/DINOv3/features.csv
clustering:
  cluster_num: 5
  standardize: true
  min_variance: 0.001
  feature_importance: 0

# DINOv3 (frozen, pretrained; the sandbox.ipynb method) -> clustering -> evaluation.
# Nothing is trained: every image is embedded once, its CLS token is the feature vector.
# Gated on Hugging Face: accept the license on the model page and `huggingface-cli login` once.
# Every option: configs/template.yaml. Run:  python run_experiment.py configs/dinov3.yaml

# ===================================================================== run
experiment: pottery          # MLflow experiment name
name: dinov3-l           # run name; null = generated (model, params, clustering, data) + date-time
stop_after: null             # null = whole run | preprocessing | features (no clustering/evaluation)
sweep:                       # one run per combination (see pipeline/README.md#sweeps); every model_name is
                             # embedded once, the clustering settings re-cluster the same features.
                             # Combinations that cannot run (ward/centroid with a non-euclidean metric, auto with
                             # a second metric) are left out and listed.
  clustering.method: [ward, average, complete, auto]
  clustering.metric: [euclidean, cosine]
  clustering.cluster_num: [5, 10, 15, 20, 25, 30]


# ===================================================================== data
data:
  source: raw                # raw: preprocess raw_path from scratch (with the crop below)
  raw_path: /data/alaczko/legion_raw_test   # the raw scans of the test split (hard links into /data/alaczko/legion_raw,
                             # the same 439 images as /data/alaczko/processed/legion/raster/test)
  labels: /data/alaczko/ocr_data.csv  # ground truth for evaluation: columns ID (file name without extension), TypeRev; null = silhouette only
  features: null             # features.csv of an earlier run: only cluster and evaluate these

# ===================================================================== preprocessing
# The same steps as configs/only_prep/raster.yaml (without Augmentor: nothing is trained),
# but cropped to a fixed half page width, so the shards keep their relative sizes.
preprocessing:
  mode: memory               # memory: only the last step's images are saved | disk: every step's are
  batch_size: 256            # images preprocessed at once in memory mode
  steps:
    - BackgroundEraser:
        mode: segmentation
        model: /data/alaczko/models/yolov8n_seg_finetuned.pt
        batch_size: 256      # YOLO inference batch; lower it on CUDA out-of-memory
        mask_margin: 0.01
        crop_size: 0.5       # square side = half the scan width, centered on the shard; null = fitted to the shard
                             # (shards larger than that are cut off, listed in MLflow as clipped.txt)
        record_axes: true
        debug_images: 0
    - Normalizer:
        target_size: 256
        background_color: [255, 255, 255]
    - Repair:
        contrast_factor: 5
        dilate_kernel_size: 1
        dilate_iterations: 1
        skeletonize: false
        output_thickness: 2
        debug_images: 0

model:
  type: dinov3
  params:
    model_name: facebook/dinov3-vitl16-pretrain-lvd1689m   # or facebook/dinov3-vits16-pretrain-lvd1689m (smaller),
                                                           # facebook/dinov3-vitl16-pretrain-lvd1689m (larger)

training:                    # nothing is trained; only batch_size is used
  batch_size: 128            # images embedded at once; lower it on CUDA out-of-memory

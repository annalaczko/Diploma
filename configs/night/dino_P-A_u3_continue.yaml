# Continues the DINO-P-A unfreeze_blocks3 model (dino_P-A.yaml, 50 epochs, ARI 0.252) for 50 more epochs.
# The weights (student, teacher, heads, center) come from model.checkpoint; the AdamW state, the
# early-stopping history and the epoch count start fresh. model.params must match the checkpoint's.
# Train on pagecrop/axes/train, cluster and evaluate the test_top5 images.
# Augmentation: build_line_drawing_augmentation (pipeline/preprocessing/augmentation.py), set in code.
# The commands for the whole GPU queue: configs/night/README.md. Every option: configs/template.yaml.

data:
  source: preprocessed
  preprocessed_path: /caa/Homes01/alaczko/Diploma/Diploma/data/processed/pagecrop/axes/train
  extract_path: /caa/Homes01/alaczko/Diploma/Diploma/data/processed/pagecrop/axes/test_top5
  labels: data/ocr_data.csv  # ground truth for evaluation: columns ID (file name without extension), TypeRev
  features: null             # must stay null: with extract_path the features are computed in this run

experiment: dinov3-night     # MLflow experiment (separate from the runs with the old augmentation)
name: DINO-P-A-u3-cont50
stop_after: null
sweep:                       # the model trained once, its features clustered 3 ways
  clustering.method: [average, ward]
  clustering.metric: [euclidean, cosine]
  clustering.cluster_num: [5]

model:
  type: dinov3
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
    finetune: true
    finetune_method: dino
    unfreeze_blocks: 3
    num_prototypes: 1024     # size of the head output (soft pseudo-classes)
    teacher_momentum: 0.99   # ~22 steps per epoch: the teacher lags ~1/(1-m) = 100 steps (~5 epochs)
    teacher_temp: 0.04       # low = sharp teacher targets
    student_temp: 0.1
    center_momentum: 0.9
  checkpoint: /caa/Homes01/alaczko/Diploma/Diploma/data/pipeline/DINO-P-A__unfreeze_blocks3-methodaverage-metriceuclidean__20261105-063354/FeatureLearningStep/DINOv3/model.pt

training:
  train: true
  epochs: 50                 # epochs ON TOP of the checkpoint's 50
  lr: 1.0e-05                # lower than the 3e-5 it was trained with: the fresh AdamW state jolts less
  batch_size: 256            # images per step (x2 views)
  early_stopping_patience: 30       # the DINO loss often rises in the first epochs
  early_stopping_min_delta: 0.0
  early_stopping_smoothing_window: 3

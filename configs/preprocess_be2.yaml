# Raw scans -> BackgroundEraser2 (shard + coordinate system) -> Normalizer -> Repair, no augmentation.
# Only the final images are written, to data/preprocessed/<run id>.
stop_after: preprocessing
data:
  source: raw
preprocessing:
  mode: memory               # no intermediate folders
  steps:
    - BackgroundEraser2: {mode: segmentation, model: models/yolov8n_seg_finetuned.pt, mask_margin: 0.01, axis_margin: 0.01, debug_images: 0}
    - Normalizer: {background_color: [255, 255, 255]}
    - Repair: {contrast_factor: 5, dilate_kernel_size: 1, dilate_iterations: 1, skeletonize: false, output_thickness: 2, debug_images: 0}
